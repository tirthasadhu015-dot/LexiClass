[theme]
base = "light"

[theme.light]
primaryColor = "#1D4ED8"
backgroundColor = "#F1F5F9"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#0F172A"
borderColor = "#CBD5E1"

[theme.light.sidebar]
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F8FAFC"
